<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Winland Particle Cloak</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cloak-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
    }
    /* Underneath plate */
    .plate {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      user-select: none;
      z-index: 1;
    }
    .headline {
      font-size: clamp(40px, 9vw, 110px);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1.05;
      background: linear-gradient(135deg, #ffffff 10%, #fb6e90 50%, #f43f5e 80%, #00f2fe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 14px;
    }
    .caption {
      font-family: "Cascadia Code", "JetBrains Mono", Consolas, monospace;
      font-size: clamp(11px, 1.8vw, 14px);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.65);
    }
    /* Canvas cloak on top */
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: block;
      cursor: crosshair;
    }
  </style>
</head>
<body>
  <div class="cloak-container" id="host">
    <!-- UNDERNEATH: Revealed Plate -->
    <div class="plate">
      <h1 class="headline">WINLAND</h1>
      <p class="caption">SUB-MILLISECOND SPRING DYNAMICS · DIRECTX 12 HARDWARE ACCELERATED · BY JEETRON1X</p>
    </div>

    <!-- THE CLOAK: Canvas 2D over normal DOM -->
    <canvas id="cloak-canvas"></canvas>
  </div>

  <script>
    const host = document.getElementById('host');
    const canvas = document.getElementById('cloak-canvas');
    const ctx = canvas.getContext('2d');

    let particles = [];
    let w = 0;
    let h = 0;

    let targetPointer = { x: 0, y: 0 };
    let easedPointer = { x: 0, y: 0 };
    let hasEntered = false;
    let isTouch = false;

    function resize() {
      const rect = host.getBoundingClientRect();
      w = rect.width;
      h = rect.height;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      // Grid step: max(9, min(w, h) / 22) px
      const step = Math.max(9, Math.min(w, h) / 22);
      particles = [];

      for (let x = step * 0.5; x < w; x += step) {
        for (let y = step * 0.5; y < h; y += step) {
          particles.push({
            homeX: x,
            homeY: y,
            x: x,
            y: y,
            vx: 0,
            vy: 0,
            r: 1 + Math.random() * 1.6 // 1 - 2.6px
          });
        }
      }

      if (!hasEntered) {
        targetPointer.x = w * 0.5;
        targetPointer.y = h * 0.5;
        easedPointer.x = w * 0.5;
        easedPointer.y = h * 0.5;
      }
    }

    window.addEventListener('resize', resize);

    // Pointer events
    window.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      targetPointer.x = e.clientX - rect.left;
      targetPointer.y = e.clientY - rect.top;
      hasEntered = true;
    });

    window.addEventListener('mouseleave', () => {
      hasEntered = false;
    });

    window.addEventListener('touchstart', (e) => {
      isTouch = true;
      hasEntered = true;
      if (e.touches[0]) {
        const rect = canvas.getBoundingClientRect();
        targetPointer.x = e.touches[0].clientX - rect.left;
        targetPointer.y = e.touches[0].clientY - rect.top;
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (e.touches[0]) {
        const rect = canvas.getBoundingClientRect();
        targetPointer.x = e.touches[0].clientX - rect.left;
        targetPointer.y = e.touches[0].clientY - rect.top;
      }
    }, { passive: true });

    resize();

    function animate() {
      requestAnimationFrame(animate);

      // Before pointer has entered (or permanent drift on touch): slow Lissajous
      if (!hasEntered || isTouch) {
        const t = performance.now() * 0.001;
        const driftX = w * 0.5 + Math.sin(t * 0.8) * (w * 0.3);
        const driftY = h * 0.5 + Math.sin(t * 1.3) * (h * 0.22);
        
        if (!hasEntered) {
          targetPointer.x = driftX;
          targetPointer.y = driftY;
        } else if (isTouch) {
          targetPointer.x = targetPointer.x * 0.95 + driftX * 0.05;
          targetPointer.y = targetPointer.y * 0.95 + driftY * 0.05;
        }
      }

      // Lerp eased pointer at 0.16
      easedPointer.x += (targetPointer.x - easedPointer.x) * 0.16;
      easedPointer.y += (targetPointer.y - easedPointer.y) * 0.16;

      ctx.clearRect(0, 0, w, h);

      const R = 0.34 * Math.min(w, h);
      const len = particles.length;

      for (let i = 0; i < len; i++) {
        const p = particles[i];

        // d = distance from the eased pointer
        const dx = p.x - easedPointer.x;
        const dy = p.y - easedPointer.y;
        const d = Math.sqrt(dx * dx + dy * dy);

        // if d < R: push particle directly away from pointer
        if (d < R) {
          const f = Math.pow(1 - d / R, 2) * 3.4;
          const dist = d || 0.001;
          p.vx += (dx / dist) * f;
          p.vy += (dy / dist) * f;
        }

        // always pull it home: v += (home - pos) * 0.024
        p.vx += (p.homeX - p.x) * 0.024;
        p.vy += (p.homeY - p.y) * 0.024;

        // damp: v *= 0.86
        p.vx *= 0.86;
        p.vy *= 0.86;

        // integrate: pos += v
        p.x += p.vx;
        p.y += p.vy;

        // FADE BY DISPLACEMENT: alpha = max(0, 0.72 - distanceFromHome / 70)
        const dHomeX = p.x - p.homeX;
        const dHomeY = p.y - p.homeY;
        const distHome = Math.sqrt(dHomeX * dHomeX + dHomeY * dHomeY);
        const alpha = Math.max(0, 0.72 - distHome / 70);

        if (alpha > 0.01) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${alpha.toFixed(3)})`;
          ctx.fill();
        }
      }
    }

    animate();
  </script>
</body>
</html>
